<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">

<title>PayProbe · Payment Security Intelligence</title>
<style>
:root, :root[data-theme="dark"] {
  --bg: #0a0e15;
  --bg-2: #0d121b;
  --surface: #121823;
  --surface-2: #171e2b;
  --surface-3: #1d2534;
  --border: #232c3c;
  --border-strong: #2f3a4e;
  --text: #eef1f6;
  --text-2: #c3cad6;
  --muted: #8691a5;
  --accent: #4d8dff;
  --accent-2: #7aa8ff;
  --accent-soft: rgba(77, 141, 255, .12);
  --violation: #ff5d5d;
  --violation-soft: rgba(255, 93, 93, .12);
  --violation-line: rgba(255, 93, 93, .38);
  --clean: #2fd087;
  --clean-soft: rgba(47, 208, 135, .11);
  --inconclusive: #f5b544;
  --inconclusive-soft: rgba(245, 181, 68, .12);
  --error: #b98cff;
  --error-soft: rgba(185, 140, 255, .13);
  --skipped: #8691a5;
  --skipped-soft: rgba(134, 145, 165, .12);
  --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 8px 24px rgba(0, 0, 0, .28);
  --radius: 14px;
  --radius-sm: 9px;
  --mono: "Cascadia Code", ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f3f5f9; --bg-2: #eef1f6; --surface: #ffffff; --surface-2: #f6f8fb; --surface-3: #edf0f5;
  --border: #e1e6ee; --border-strong: #cdd5e1; --text: #111725; --text-2: #354052; --muted: #66718a;
  --accent: #2563eb; --accent-2: #1d4ed8; --accent-soft: rgba(37, 99, 235, .09);
  --violation: #d32f2f; --violation-soft: rgba(211, 47, 47, .08); --violation-line: rgba(211, 47, 47, .35);
  --clean: #12895a; --clean-soft: rgba(18, 137, 90, .09); --inconclusive: #b06d00; --inconclusive-soft: rgba(176, 109, 0, .1);
  --error: #7c3aed; --error-soft: rgba(124, 58, 237, .09); --skipped: #66718a; --skipped-soft: rgba(102, 113, 138, .1);
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 4px 14px rgba(16, 24, 40, .06);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; color: var(--text); background: var(--bg);
  font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
body::before { /* restrained top glow, not decorative imagery */
  content: ""; position: fixed; inset: 0 0 auto 0; height: 420px; pointer-events: none; z-index: 0;
  background: radial-gradient(900px 300px at 20% -80px, var(--accent-soft), transparent 70%);
}
.wrap { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; padding: 0 20px; }
@media (max-width: 560px) { .wrap { padding: 0 16px; } }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--mono); }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.topbar .wrap { display: flex; align-items: center; gap: 12px; min-height: 64px; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
.brand { display: flex; align-items: center; gap: 11px; margin-right: auto; min-width: 0; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; background: linear-gradient(145deg, var(--accent), #2b5fd9); box-shadow: 0 4px 14px rgba(77, 141, 255, .35); }
.brand-mark svg { width: 19px; height: 19px; }
.brand-name { font-weight: 750; font-size: 17px; letter-spacing: -.01em; line-height: 1.15; }
.brand-sub { color: var(--muted); font-size: 12.5px; font-weight: 550; letter-spacing: .01em; }
.env-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.env-chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--inconclusive); }
.file-name { color: var(--muted); font: 12px var(--mono); max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button { font: inherit; cursor: pointer; }
.btn { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 650; border-radius: 10px; padding: 9px 16px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text); transition: background .15s, border-color .15s, transform .05s, box-shadow .15s; }
.btn:hover { border-color: var(--accent); background: var(--surface-3); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 4px 16px rgba(77, 141, 255, .28); }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.lg { font-size: 15px; padding: 12px 22px; border-radius: 12px; }
.icon-btn { width: 38px; height: 38px; padding: 0; justify-content: center; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
@media (max-width: 720px) { .env-chip { display: none; } .file-name { order: 5; flex-basis: 100%; max-width: 100%; } }
@media (max-width: 420px) { .brand-sub { display: none; } .btn.load-top span { display: none; } .btn.load-top { padding: 9px 11px; } }

main.wrap { padding-top: 24px; padding-bottom: 56px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.panel-pad { padding: 20px; }
@media (max-width: 560px) { .panel-pad { padding: 16px; } }
.eyebrow { display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
.eyebrow .count { color: var(--text-2); background: var(--surface-3); border-radius: 999px; padding: 0 8px; letter-spacing: 0; font-size: 11.5px; }
.unavailable { color: var(--muted); font-style: italic; font-weight: 450; }

/* ---------- states ---------- */
.state { display: grid; place-items: center; text-align: center; min-height: calc(100vh - 200px); padding: 24px 0; }
.state-card { width: min(560px, 100%); padding: 44px 32px; border-radius: 20px; border: 1px dashed var(--border-strong); background: var(--surface); transition: border-color .15s, background .15s; }
.state-card.dragging { border-color: var(--accent); background: var(--accent-soft); }
.state-icon { width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 20px; display: grid; place-items: center; color: var(--accent); background: var(--accent-soft); border: 1px solid rgba(77, 141, 255, .25); }
.state-icon svg { width: 34px; height: 34px; stroke-width: 1.6; }
.state h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: -.015em; }
.state p { margin: 0 auto; color: var(--muted); max-width: 420px; }
.state .actions { margin-top: 24px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.state .hint { margin-top: 18px; font-size: 12.5px; color: var(--muted); }
.state.invalid .state-icon { color: var(--violation); background: var(--violation-soft); border-color: var(--violation-line); }
.state.invalid .state-card { border-style: solid; border-color: var(--violation-line); }
.spinner { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--border-strong); border-top-color: var(--accent); margin: 0 auto 18px; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

/* ---------- pills & chips ---------- */
.pill { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; padding: 4px 11px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.s-violation { color: var(--violation); background: var(--violation-soft); border-color: var(--violation-line); }
.s-clean, .s-completed, .s-validated { color: var(--clean); background: var(--clean-soft); border-color: rgba(47, 208, 135, .3); }
.s-inconclusive, .s-stopped, .s-running { color: var(--inconclusive); background: var(--inconclusive-soft); border-color: rgba(245, 181, 68, .32); }
.s-error, .s-cleanup_failed { color: var(--error); background: var(--error-soft); border-color: rgba(185, 140, 255, .32); }
.s-skipped, .s-unknown, .s-other { color: var(--skipped); background: var(--skipped-soft); border-color: var(--border-strong); }
.chip { display: inline-flex; align-items: center; font: 700 12px/1 var(--mono); padding: 5px 8px; border-radius: 7px; background: var(--surface-3); border: 1px solid var(--border-strong); color: var(--text-2); white-space: nowrap; }
.chip.target { color: var(--accent-2); border-color: rgba(77, 141, 255, .45); background: var(--accent-soft); }
.chip.side { color: var(--inconclusive); border-color: rgba(245, 181, 68, .4); background: var(--inconclusive-soft); }
.chip.hit { color: var(--violation); border-color: var(--violation-line); background: var(--violation-soft); }
.chips { display: inline-flex; flex-wrap: wrap; gap: 5px; }
.dots { display: inline-flex; gap: 4px; vertical-align: middle; }
.dot { width: 10px; height: 10px; border-radius: 3px; background: var(--surface-3); border: 1px solid var(--border-strong); }
.dot.violation { background: var(--violation); border-color: var(--violation); }
.dot.clean { background: var(--clean); border-color: var(--clean); }
.dot.inconclusive { background: var(--inconclusive); border-color: var(--inconclusive); }
.dot.error, .dot.cleanup_failed { background: var(--error); border-color: var(--error); }

/* ---------- hero ---------- */
.hero { padding: 24px; display: grid; gap: 14px; }
.hero-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.hero h1 { margin: 0; font-size: 30px; line-height: 1.15; letter-spacing: -.025em; overflow-wrap: anywhere; }
.hero .meta { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13px; color: var(--muted); }
.hero .meta b { color: var(--text-2); font-weight: 600; }
.headline { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); font-size: 16px; font-weight: 600; color: var(--text); }
.headline svg { margin-top: 2px; width: 20px; height: 20px; }
.headline.violation { border-color: var(--violation-line); background: linear-gradient(90deg, var(--violation-soft), transparent 70%); }
.headline.violation svg { color: var(--violation); }
.headline.clean svg { color: var(--clean); }
.headline.inconclusive svg, .headline.stopped svg { color: var(--inconclusive); }
.headline.error svg { color: var(--error); }
.headline .sub { display: block; font-size: 13.5px; font-weight: 500; color: var(--muted); margin-top: 2px; }
.disclaimer { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.disclaimer svg { width: 15px; height: 15px; }
@media (max-width: 560px) { .hero { padding: 18px; } .hero h1 { font-size: 24px; } .headline { font-size: 15px; } }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: 10px; font-size: 13.5px; border: 1px solid rgba(245, 181, 68, .35); background: var(--inconclusive-soft); color: var(--text-2); }
.notice svg { color: var(--inconclusive); margin-top: 1px; }
.notice.bad { border-color: var(--violation-line); background: var(--violation-soft); }
.notice.bad svg { color: var(--violation); }
.notice ul { margin: 4px 0 0; padding-left: 18px; }

/* ---------- KPIs ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-top: 16px; }
.kpi { position: relative; padding: 16px 18px; overflow: hidden; }
.kpi::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--border-strong); }
.kpi .k-top { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12.5px; font-weight: 650; }
.kpi .k-top svg { width: 17px; height: 17px; }
.kpi .n { font-size: 38px; font-weight: 780; line-height: 1.1; margin-top: 8px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.kpi .n.na { font-size: 18px; font-weight: 600; color: var(--muted); font-style: italic; letter-spacing: 0; padding: 10px 0 6px; }
.kpi.k-violation::after { background: var(--violation); } .kpi.k-violation .n, .kpi.k-violation svg { color: var(--violation); }
.kpi.k-clean::after { background: var(--clean); } .kpi.k-clean .n, .kpi.k-clean svg { color: var(--clean); }
.kpi.k-inconclusive::after { background: var(--inconclusive); } .kpi.k-inconclusive .n, .kpi.k-inconclusive svg { color: var(--inconclusive); }
.kpi.k-error::after { background: var(--error); } .kpi.k-error .n, .kpi.k-error svg { color: var(--error); }
.kpi.k-total::after { background: var(--accent); } .kpi.k-total svg { color: var(--accent); }
.kpi.k-zero .n { color: var(--muted); }
.runline { margin-top: 10px; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; }
.runline b { color: var(--text-2); font-variant-numeric: tabular-nums; }

/* ---------- primary finding ---------- */
.primary-finding { margin-top: 20px; border-color: var(--violation-line); position: relative; overflow: hidden; }
.primary-finding::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--violation); }
.primary-finding .p-head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px 16px; }
.primary-finding .p-head .titles { margin-right: auto; min-width: 0; }
.primary-finding .p-head .eyebrow { color: var(--violation); margin-bottom: 8px; }
.primary-finding h2 { margin: 0; font-size: 22px; letter-spacing: -.015em; line-height: 1.25; overflow-wrap: anywhere; }
.primary-finding .sid { font: 12.5px var(--mono); color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; margin-top: 18px; background: var(--border); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.stat { background: var(--surface-2); padding: 12px 14px; }
.stat .l { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stat .v { margin-top: 6px; font-size: 15px; font-weight: 650; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stat .v.big { font-size: 26px; font-weight: 780; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.impact { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
@media (max-width: 820px) { .impact { grid-template-columns: 1fr; } }
.impact-box { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; background: var(--bg-2); min-width: 0; }
.impact-box.target { border-color: var(--violation-line); }
.impact-box h3 { margin: 0 0 10px; font-size: 12px; font-weight: 750; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.impact-box.target h3 { color: var(--violation); }
.impact-item + .impact-item { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
.impact-item .ih { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 650; }
.kind { font: 600 13px var(--mono); color: var(--text); overflow-wrap: anywhere; }
dl.kv { display: grid; grid-template-columns: minmax(110px, max-content) 1fr; gap: 6px 14px; margin: 10px 0 0; font-size: 13.5px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; overflow-wrap: anywhere; color: var(--text-2); font-weight: 550; }
dl.kv dd.mono { font-size: 12.5px; }
@media (max-width: 560px) { dl.kv { grid-template-columns: 1fr; gap: 0; } dl.kv dd { margin-bottom: 7px; } }
.none-note { color: var(--muted); font-size: 13.5px; }
.timeline { list-style: none; margin: 16px 0 0; padding: 0; position: relative; }
.timeline::before { content: ""; position: absolute; left: 11px; top: 8px; bottom: 8px; width: 2px; background: var(--border-strong); }
.timeline li { position: relative; padding: 4px 0 10px 36px; font-size: 14px; color: var(--text-2); overflow-wrap: anywhere; }
.timeline li::before { content: attr(data-n); position: absolute; left: 0; top: 2px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 700 11.5px var(--mono); background: var(--surface-3); border: 1px solid var(--border-strong); color: var(--muted); }
.timeline li.mark-target::before { background: var(--violation); border-color: var(--violation); color: #fff; }
.timeline li.mark-side::before { background: var(--inconclusive); border-color: var(--inconclusive); color: #1b1300; }
.timeline .tag { margin-left: 8px; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.timeline .tag.t { color: var(--violation); } .timeline .tag.s { color: var(--inconclusive); }
.basis { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
.basis span { display: inline-flex; align-items: center; gap: 6px; }
.basis svg { width: 15px; height: 15px; color: var(--clean); }
.more { margin-top: 12px; font-size: 13px; color: var(--muted); }

/* ---------- disclosure ---------- */
details.drawer { margin-top: 12px; border: 1px solid var(--border); border-radius: 11px; background: var(--bg-2); }
details.drawer > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 10px 14px; font-size: 13.5px; font-weight: 650; color: var(--text-2); border-radius: 11px; }
details.drawer > summary::-webkit-details-marker { display: none; }
details.drawer > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; margin-right: 4px; }
details.drawer[open] > summary::before { transform: rotate(45deg); }
details.drawer > summary:hover { color: var(--text); background: var(--surface-2); }
details.drawer > summary .count { margin-left: auto; color: var(--muted); font-weight: 600; font-size: 12.5px; }
.drawer-body { padding: 2px 14px 14px; font-size: 13.5px; color: var(--text-2); }
.drawer-body ul, .drawer-body ol { margin: 6px 0 0; padding-left: 20px; }
.drawer-body li { margin: 5px 0; overflow-wrap: anywhere; }
.drawer-body h4 { margin: 14px 0 6px; font-size: 11.5px; font-weight: 750; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.drawer-body h4:first-child { margin-top: 6px; }
.claim { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: baseline; margin: 10px 0; }
.claim .ref { grid-column: 2; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.ref a { color: var(--accent-2); text-decoration: none; } .ref a:hover { text-decoration: underline; }
.cs { font: 800 11px var(--mono); padding: 3px 6px; border-radius: 6px; border: 1px solid; }
.cs.c-V { color: var(--clean); border-color: rgba(47, 208, 135, .4); } .cs.c-U { color: var(--violation); border-color: var(--violation-line); } .cs.c-A { color: var(--inconclusive); border-color: rgba(245, 181, 68, .4); }
.table-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
td.st-pass { color: var(--clean); font-weight: 650; } td.st-violation { color: var(--violation); font-weight: 750; } td.st-cannot_verify { color: var(--inconclusive); font-weight: 650; }
td .note { display: block; color: var(--muted); font-weight: 450; font-size: 12px; }
pre.json { margin: 6px 0 0; font: 12px/1.5 var(--mono); background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-2); }

/* ---------- AI investigator ---------- */
.ai-chip { display: inline-flex; align-items: center; gap: 6px; font: 700 11.5px/1 var(--mono); padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border-strong); color: var(--muted); white-space: nowrap; }
.ai-chip svg { width: 14px; height: 14px; }
.ai-chip.ai-real { color: #c9b8ff; border-color: rgba(167, 139, 250, .5); background: rgba(167, 139, 250, .12); }
:root[data-theme="light"] .ai-chip.ai-real { color: #6d28d9; }
.ai-chip.ai-mock { color: var(--inconclusive); border-color: rgba(245, 181, 68, .45); background: var(--inconclusive-soft); }
.ai-section { margin-top: 24px; padding: 22px; border-radius: 18px; border: 1px solid rgba(167, 139, 250, .35); background: linear-gradient(180deg, rgba(167, 139, 250, .07), transparent 320px), var(--surface); box-shadow: var(--shadow); display: grid; gap: 16px; }
@media (max-width: 560px) { .ai-section { padding: 16px; } }
.ai-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.ai-eyebrow { color: #b59cff; margin-bottom: 6px; }
:root[data-theme="light"] .ai-eyebrow { color: #6d28d9; }
.ai-title { margin: 0; font-size: 20px; letter-spacing: -.015em; }
.ai-meta { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13px; color: var(--muted); }
.ai-meta b { color: var(--text-2); font-weight: 650; }
.authority { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); padding: 9px 12px; border-radius: 10px; background: var(--clean-soft); border: 1px solid rgba(47, 208, 135, .28); }
.authority svg { color: var(--clean); width: 16px; height: 16px; }
.flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 900px) { .flow { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 480px) { .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.flow li { padding: 10px 12px; border-radius: 11px; border: 1px solid var(--border); background: var(--bg-2); display: grid; gap: 2px; position: relative; overflow: hidden; }
.flow li::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--border-strong); }
.flow li b { font-size: 13px; }
.flow li span { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.flow li.flow-ok::before { background: var(--clean); } .flow li.flow-warn::before { background: var(--inconclusive); } .flow li.flow-bad::before { background: var(--violation); }
.ai-card { border-color: var(--border-strong); }
.ai-card h4, .ai-h4 { margin: 14px 0 6px; font-size: 11.5px; font-weight: 750; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.ai-text { margin: 0; font-size: 14px; color: var(--text-2); line-height: 1.55; overflow-wrap: anywhere; }
.ai-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 22px; }
@media (max-width: 820px) { .ai-grid { grid-template-columns: 1fr; } }
.verdict-banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; font-size: 15px; margin-top: 4px; }
.verdict-banner svg { width: 22px; height: 22px; margin-top: 1px; }
.verdict-banner .sub { display: block; font-size: 13.5px; color: var(--text-2); font-weight: 500; margin-top: 3px; }
.verdict-banner.ok { background: var(--clean-soft); border: 1px solid rgba(47, 208, 135, .4); } .verdict-banner.ok svg { color: var(--clean); }
.verdict-banner.bad { background: var(--violation-soft); border: 1px solid var(--violation-line); } .verdict-banner.bad svg { color: var(--violation); }
.diff-wrap { border: 1px solid var(--border); border-radius: 9px; overflow: hidden; margin-top: 6px; }
.diff-file { font-size: 12px; padding: 6px 10px; background: var(--surface-3); color: var(--muted); border-bottom: 1px solid var(--border); }
pre.diff { margin: 0; padding: 8px 0; font: 12.5px/1.55 var(--mono); overflow-x: auto; background: var(--bg-2); }
pre.diff span { display: block; padding: 0 12px; white-space: pre; }
.d-del { color: #ff9b9b; background: rgba(255, 93, 93, .1); } .d-add { color: #7ee2ad; background: rgba(47, 208, 135, .1); }
:root[data-theme="light"] .d-del { color: #b42318; } :root[data-theme="light"] .d-add { color: #067647; }
.ok-line { color: var(--clean); font-size: 13.5px; font-weight: 600; } .bad-line { color: var(--violation); font-size: 13px; }
.cite { margin-top: 10px; } .cite-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.agent-steps { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
.agent-steps li { border: 1px solid var(--border); border-left: 3px solid var(--clean); border-radius: 10px; padding: 9px 12px; background: var(--bg-2); }
.agent-steps li.bad { border-left-color: var(--inconclusive); }
.as-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px; }
.as-args { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.as-head .ms { margin-left: auto; font: 12px var(--mono); color: var(--muted); }
.as-thought { font-size: 13px; color: var(--text-2); margin-top: 4px; font-style: italic; overflow-wrap: anywhere; }
.as-obs { font: 12.5px var(--mono); color: var(--accent-2); margin-top: 4px; }
.hyps { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; font-size: 13.5px; color: var(--text-2); }
.hyps .note { color: var(--muted); font-size: 12.5px; }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; margin-top: 24px; align-items: start; }
@media (max-width: 1020px) { .layout { grid-template-columns: 1fr; } }
.side { display: grid; gap: 16px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.section-head .eyebrow { margin: 0; }
.filters { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 3px; border: 1px solid var(--border); border-radius: 11px; background: var(--surface); }
.filters button { border: 0; background: transparent; color: var(--muted); font-size: 12.5px; font-weight: 650; padding: 6px 11px; border-radius: 8px; }
.filters button:hover { color: var(--text); }
.filters button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); box-shadow: 0 0 0 1px var(--border-strong) inset; }

/* ---------- scenario cards ---------- */
.scenarios { display: grid; gap: 10px; }
details.scenario { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; transition: border-color .15s, background .15s; position: relative; overflow: hidden; }
details.scenario::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--border-strong); }
details.scenario[data-outcome="violation"]::before { background: var(--violation); }
details.scenario[data-outcome="clean"]::before { background: var(--clean); }
details.scenario[data-outcome="inconclusive"]::before { background: var(--inconclusive); }
details.scenario[data-outcome="error"]::before { background: var(--error); }
details.scenario:hover { border-color: var(--border-strong); }
details.scenario[open] { background: var(--surface); border-color: var(--border-strong); }
details.scenario > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto auto;align-items: center; gap: 8px 18px; padding: 14px 16px 14px 20px; }
details.scenario > summary::-webkit-details-marker { display: none; }
.sc-title { min-width: 0; }
.sc-title .t { font-weight: 650; font-size: 14.5px; line-height: 1.3; overflow-wrap: anywhere; }
.sc-title .id { font: 12px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.sc-repro { display: inline-flex; align-items: center; gap: 8px; font: 700 14px var(--mono); color: var(--text-2); }
.chev { width: 16px; height: 16px; color: var(--muted); transition: transform .15s; }
details.scenario[open] .chev { transform: rotate(180deg); }
.sc-body { padding: 0 16px 16px 20px; border-top: 1px solid var(--border); }
.sc-summary { margin-top: 12px; padding: 10px 12px; border-radius: 9px; font-size: 13.5px; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--border); }
.sc-summary.violation { background: var(--violation-soft); border-color: var(--violation-line); }
.sc-summary.inconclusive { background: var(--inconclusive-soft); border-color: rgba(245, 181, 68, .32); }
.sc-summary .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.sc-summary .row + .row { margin-top: 6px; }
.sc-facts { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
.sc-facts b { color: var(--text-2); font-weight: 600; }
@media (max-width: 640px) {
  details.scenario > summary { grid-template-columns: minmax(0, 1fr) auto; }
  details.scenario > summary .chips { grid-column: 1; grid-row: 2; }
  details.scenario > summary .sc-repro { grid-column: 2; grid-row: 2; justify-self: end; }
  details.scenario > summary .pill { grid-column: 2; grid-row: 1; }
  details.scenario > summary .chev { display: none; }
}

/* ---------- side cards ---------- */
.side .panel { padding: 18px; }
.meter { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--surface-3); margin: 12px 0 4px; }
.meter span { display: block; height: 100%; }
.meter .m-ok { background: var(--clean); } .meter .m-cv { background: var(--inconclusive); } .meter .m-bad { background: var(--violation); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; background: currentColor; }
.legend .l-ok { color: var(--clean); } .legend .l-cv { color: var(--inconclusive); } .legend .l-bad { color: var(--violation); }
.legend b { color: var(--text-2); }
.rows { margin: 12px 0 0; display: grid; gap: 8px; font-size: 13.5px; }
.rows > div { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.rows dt { color: var(--muted); } .rows dd { margin: 0; text-align: right; font-weight: 600; color: var(--text-2); overflow-wrap: anywhere; min-width: 0; }
.stages { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 2px; }
.stages li { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13.5px; border-bottom: 1px dashed var(--border); }
.stages li:last-child { border-bottom: 0; }
.stages li svg { width: 16px; height: 16px; color: var(--clean); }
.stages li.fail svg { color: var(--violation); }
.stages li .ms { margin-left: auto; font: 12px var(--mono); color: var(--muted); }
.stages li .x { color: var(--muted); font-size: 12px; }
.limitations { margin-top: 20px; }
footer { color: var(--muted); font-size: 12px; text-align: center; padding: 8px 16px 40px; position: relative; z-index: 1; }
@media print {
  body::before { display: none; }
  .topbar { position: static; backdrop-filter: none; }
  .filters, #load-btn, #theme-btn { display: none; }
  details { display: block; } details > * { display: block; }
  details.scenario, .panel { break-inside: avoid; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.6-3 8.4-7 10-4-1.6-7-5.4-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg></span>
      <span><span class="brand-name">PayProbe</span><br><span class="brand-sub">Payment Security Intelligence</span></span>
    </div>
    <span class="env-chip" title="Results come from local isolated fixture apps and a mock Razorpay gateway">Local testing · Mock gateway</span>
    <span class="file-name" id="file-name"></span>
    <button type="button" class="btn icon-btn" id="theme-btn" aria-label="Toggle light or dark theme" title="Toggle theme">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
    </button>
    <button type="button" class="btn primary load-top" id="load-btn">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg><span>Load Investigation</span>
    </button>
    <label class="sr-only" for="file-input">Choose a PayProbe JSON investigation report</label>
    <input type="file" id="file-input" accept=".json,application/json" hidden>
  </div>
</header>
<main class="wrap" id="app" aria-live="polite"></main>
<footer>Read-only · the report stays in this browser tab and is never uploaded or modified.</footer>

<script>
'use strict';
(function () {
  // ------------------------------------------------------------------ model (no DOM)
  // Turns a parsed payprobe.investigation/v1 report into a plain view model. Every field is optional:
  // anything absent is recorded in `missing` and rendered as "unavailable", never guessed.
  var EXPECTED_SCHEMA = 'payprobe.investigation/v1';
  var SCENARIO_OUTCOMES = ['violation', 'clean', 'inconclusive'];
  var RUN_OUTCOMES = ['violation', 'clean', 'inconclusive', 'error', 'cleanup_failed'];

  function ViewerError(kind, message) { this.kind = kind; this.message = message; }

  var isObj = function (v) { return v !== null && typeof v === 'object' && !Array.isArray(v); };
  var arr = function (v) { return Array.isArray(v) ? v : []; };
  var str = function (v) { return v === undefined || v === null ? null : String(v); };
  var num = function (v) { return typeof v === 'number' && isFinite(v) ? v : null; };
  var uniq = function (xs) { var seen = {}; return xs.filter(function (x) { var k = String(x); if (seen[k]) return false; seen[k] = true; return true; }); };

  // Keys inside a violation detail (depth-limited) whose value is exactly `label`; used to mark and
  // annotate the timeline steps a violation names (e.g. paidSince / reversedAt).
  function keysNaming(v, label, depth) {
    if (depth <= 0 || v === null || typeof v !== 'object') return [];
    return [].concat.apply([], Object.keys(v).map(function (k) { return v[k] === label ? [k] : keysNaming(v[k], label, depth - 1); }));
  }

  function buildModel(r) {
    if (!isObj(r)) throw new ViewerError('shape', Array.isArray(r) ? 'The file contains a JSON array, not a PayProbe report.' : 'The file does not contain a JSON object.');
    var recognised = ['schema', 'app', 'status', 'findings', 'stages', 'validation'].filter(function (k) { return k in r; });
    if (!recognised.length) throw new ViewerError('shape', 'This JSON is not a PayProbe investigation report.');

    var warnings = [];
    var missing = [];
    if (r.schema !== EXPECTED_SCHEMA) warnings.push(r.schema === undefined ? 'No "schema" field; shown on a best-effort basis.' : 'Unexpected schema "' + String(r.schema) + '" (expected ' + EXPECTED_SCHEMA + '); shown on a best-effort basis.');
    ['app', 'status', 'validation', 'mapping', 'stages', 'findings', 'limitations'].forEach(function (k) { if (!(k in r) || r[k] === null) missing.push(k); });

    var app = isObj(r.app) ? r.app : {};
    var hasFindings = Array.isArray(r.findings);
    var findings = arr(r.findings).filter(isObj);
    if ('findings' in r && !hasFindings) warnings.push('"findings" is not a list; no scenarios can be shown.');

    // Scenario-level outcomes come only from findings[].outcome; anything else is counted as "other".
    var scenarioCounts = { violation: 0, clean: 0, inconclusive: 0, other: 0 };
    // Repetition-level counts: findings[].counted, else derived from records[].countedAs.
    var runCounts = { violation: 0, clean: 0, inconclusive: 0, error: 0, cleanup_failed: 0, total: 0, unknownScenarios: 0 };
    var countSource = 'counted';

    var selection = arr(r.selection).filter(isObj);
    var selectionById = {};
    selection.forEach(function (s) { if (s.scenario) selectionById[String(s.scenario)] = s; });

    var scenarios = findings.map(function (f, i) {
      var id = str(f.scenario) || ('scenario #' + (i + 1));
      var records = arr(f.records).filter(isObj);
      var outcome = SCENARIO_OUTCOMES.indexOf(f.outcome) >= 0 ? f.outcome : (f.outcome === undefined ? 'unknown' : String(f.outcome));
      if (SCENARIO_OUTCOMES.indexOf(outcome) >= 0) scenarioCounts[outcome]++; else scenarioCounts.other++;

      var counted = isObj(f.counted) ? f.counted : null;
      var runsKnown = !!counted || records.length > 0;
      if (!runsKnown) runCounts.unknownScenarios++;
      var runs = {};
      if (counted) {
        RUN_OUTCOMES.forEach(function (k) { runs[k] = num(counted[k]) || 0; });
      } else {
        countSource = 'records';
        RUN_OUTCOMES.forEach(function (k) { runs[k] = 0; });
        records.forEach(function (rec) { var k = rec.countedAs || rec.outcome; if (k in runs) runs[k]++; });
      }
      var runTotal = RUN_OUTCOMES.reduce(function (a, k) { return a + runs[k]; }, 0);
      RUN_OUTCOMES.forEach(function (k) { runCounts[k] += runs[k]; });
      runCounts.total += runTotal;

      var targets = arr(f.targets).map(String);
      var kindsObj = isObj(f.violationKinds) ? f.violationKinds : {};
      var violated = Object.keys(kindsObj).map(function (inv) {
        return { id: inv, kinds: arr(kindsObj[inv]).map(String), isTarget: targets.indexOf(inv) >= 0 };
      });
      violated.sort(function (a, b) { return (b.isTarget - a.isTarget) || a.id.localeCompare(b.id); });

      var ev = isObj(f.evidence) ? f.evidence : null;
      var first = ev && isObj(ev.firstRun) ? ev.firstRun : null;
      var firstRecord = records[0] || null;
      var verdicts = firstRecord ? arr(firstRecord.verdicts).filter(isObj).map(function (v) {
        return {
          id: str(v.id) || '?', status: str(v.status) || 'unknown', checked: num(v.checked), vacuous: v.vacuous === true,
          kinds: arr(v.violationKinds).map(String),
          violations: arr(v.violations),
          unverifiable: arr(v.unverifiable).map(function (u) { return isObj(u) ? arr(u.reason).map(String).join('; ') || (u.check ? String(u.check) : '') : String(u); }).filter(Boolean),
          isTarget: targets.indexOf(String(v.id)) >= 0,
        };
      }) : [];
      // Per-invariant detail objects from the first repetition, for the impact panels.
      violated.forEach(function (v) {
        var verdict = verdicts.filter(function (x) { return x.id === v.id; })[0];
        v.details = verdict ? verdict.violations.filter(isObj) : [];
      });

      var reproducedCount = num(f.reproducedCount);
      var reproduced = str(f.reproduced) || (reproducedCount !== null && runTotal ? reproducedCount + '/' + runTotal : null);
      var steps = first ? arr(first.steps).map(String) : (firstRecord ? arr(firstRecord.steps).map(function (s) { return isObj(s) ? String(s.label) : String(s); }) : []);
      // Steps named by a violation detail (e.g. "paidSince"/"reversedAt" step labels): target first, then side effects.
      var keysFor = function (isTarget, label) {
        return uniq([].concat.apply([], violated.filter(function (v) { return v.isTarget === isTarget; }).map(function (v) {
          return [].concat.apply([], v.details.map(function (d) { return keysNaming(d, label, 3).map(function (k) { return v.id + ' ' + k; }); }));
        })));
      };
      var stepMarks = steps.map(function (label) {
        var t = keysFor(true, label);
        if (t.length) return { kind: 'target', keys: t };
        var s = keysFor(false, label);
        return s.length ? { kind: 'side', keys: s } : null;
      });

      return {
        id: id,
        title: firstRecord && firstRecord.title ? String(firstRecord.title) : null,
        outcome: outcome,
        targets: targets,
        mode: str(f.mode),
        concurrency: str(f.concurrency),
        verifiedConcurrent: num(f.verifiedConcurrent),
        reproduced: reproduced,
        reproducedCount: reproducedCount,
        runs: runs,
        runTotal: runTotal,
        runsKnown: runsKnown,
        runDots: records.length ? records.map(function (rec) { return String(rec.countedAs || rec.outcome || 'unknown'); }) : expandCounts(runs),
        violated: violated,
        outcomeBasis: ev ? str(ev.outcomeBasis) : null,
        ledgerIndependent: ev && typeof ev.ledgerIndependent === 'boolean' ? ev.ledgerIndependent : null,
        steps: steps,
        stepMarks: stepMarks,
        firstViolations: first ? arr(first.violations) : [],
        preconditionFailures: first && isObj(first.preconditions) ? arr(first.preconditions.failures).map(String) : [],
        reasons: uniq([].concat.apply([], records.map(function (rec) { return arr(rec.reasons).map(String); }))),
        errors: uniq(records.map(function (rec) { return isObj(rec.error) ? (rec.error.stage ? rec.error.stage + ': ' : '') + String(rec.error.message) : null; }).filter(Boolean)),
        cleanupProblems: uniq(records.map(function (rec) { return isObj(rec.cleanup) && rec.cleanup.ok === false ? String(rec.cleanup.error || 'cleanup did not succeed') : null; }).filter(Boolean)),
        verdicts: verdicts,
        contract: arr(f.contract).filter(isObj).map(function (c) { return { status: str(c.status) || '?', basis: str(c.basis), claim: str(c.claim) || '', ref: str(c.ref) }; }),
        conditionalOn: arr(f.conditionalOn).map(String),
        reproInstructions: arr(f.reproInstructions).map(String),
        narrative: str(f.narrative),
        requires: selectionById[id] ? arr(selectionById[id].requires).map(String) : [],
        hasEvidence: !!ev,
        hasRecords: records.length > 0,
        order: i,
      };
    });

    var findingIds = {};
    scenarios.forEach(function (s) { findingIds[s.id] = true; });
    var skipped = selection.filter(function (s) { return s.selected === false && !findingIds[String(s.scenario)]; }).map(function (s) {
      return { id: str(s.scenario) || 'unnamed scenario', targets: arr(s.targets).map(String), unmet: arr(s.unmet).map(String), requires: arr(s.requires).map(String) };
    });

    // Primary finding: the violation reproduced most often (report order breaks ties). Derived, never named.
    var violations = scenarios.filter(function (s) { return s.outcome === 'violation'; }).sort(function (a, b) {
      return ((b.reproducedCount === null ? -1 : b.reproducedCount) - (a.reproducedCount === null ? -1 : a.reproducedCount)) || (a.order - b.order);
    });

    // Consecutive stages with the same name (one "execute" per scenario) are grouped.
    var stages = [];
    arr(r.stages).filter(isObj).forEach(function (s) {
      var name = str(s.stage) || 'stage';
      var last = stages[stages.length - 1];
      var ms = num(s.durationMs) || 0;
      var ok = s.ok === true;
      if (last && last.name === name) { last.count++; last.ms += ms; last.ok = last.ok && ok; if (!ok) last.error = errorText(s.detail) || last.error; }
      else stages.push({ name: name, count: 1, ms: ms, ok: ok, error: ok ? null : errorText(s.detail) });
    });

    var v = isObj(r.validation) ? r.validation : null;
    var m = isObj(r.mapping) ? r.mapping : null;
    var code = isObj(r.code) ? r.code : null;
    var scenariosRun = num(r.scenariosRun);
    if (scenariosRun !== null && hasFindings && scenariosRun !== scenarios.length) warnings.push('The report says ' + scenariosRun + ' scenario(s) ran but lists ' + scenarios.length + ' finding(s).');
    if (scenarioCounts.other) warnings.push(scenarioCounts.other + ' scenario(s) have an unrecognised outcome; they are counted under "Other".');
    if (countSource === 'records' && runCounts.unknownScenarios < scenarios.length) warnings.push('Some findings have no "counted" summary; repetition counts were derived from their run records.');
    if (runCounts.unknownScenarios) warnings.push(runCounts.unknownScenarios + ' scenario(s) have neither a "counted" summary nor run records, so their repetitions are not counted.');

    return {
      schema: str(r.schema),
      appId: str(app.id),
      impl: str(app.impl),

        h('td', { class: 'mono', text: c.usage ? fmtTok(c.usage.prompt) + ' / ' + fmtTok(c.usage.completion) + (c.usage.reasoning ? ' (' + fmtTok(c.usage.reasoning) + ' reasoning)' : '') : '—' })));
    });
    var previews = m.ai.calls.map(function (c) {
      return h('div', { class: 'cite' }, h('div', { class: 'cite-head' }, h('span', { class: 'chip', text: c.purpose || '?' }), h('span', { text: (c.inputChars !== null ? c.inputChars + ' input chars' : '') + (c.error ? ' · ' + c.error : '') })),
        h('pre', { class: 'json', text: 'IN  ' + (c.inputPreview || '—') + '\nOUT ' + (c.outputPreview || '—') }));
    });
    return h('section', { class: 'ai-calls' }, drawer('Model calls · provider, latency, pacing, tokens', plural(m.ai.calls.length, 'call'), [
      h('div', { class: 'table-scroll' }, h('table', null, h('thead', null, h('tr', null, h('th', { text: 'Purpose' }), h('th', { text: 'Status' }), h('th', { text: 'Model' }), h('th', { text: 'Latency' }), h('th', { text: 'Rate-limit pacing' }), h('th', { text: 'Tokens in / out' }))), tb)),

  }

  function renderAi(m) {
    var ai = m.ai;
    if (!ai) return null;
    var t = ai.totals;
    var wrap = h('section', { class: 'ai-section', id: 'ai-investigator', data: { aiMode: ai.mode, aiStatus: ai.status } },
      h('div', { class: 'ai-head' },
        h('div', null, h('div', { class: 'eyebrow ai-eyebrow' }, icon('spark'), 'AI Investigator'), h('h2', { class: 'ai-title', text: 'Discover → Understand → Investigate → Explain → Fix → Verify' })),
        aiModeChip(ai)),
      h('div', { class: 'ai-meta' },
        h('span', null, 'Provider ', h('b', null, val(ai.provider))), h('span', null, 'Model ', h('b', { class: 'mono' }, val(ai.model))),
        h('span', null, 'Model calls ', h('b', { text: (t.calls ?? '—') + (t.failed ? ' (' + t.failed + ' failed)' : '') })),

    if (ai.evals) append(wrap, renderEvals(m));

  }

  // ---------- scenario list ----------
  function scenarioSummary(s) {
    if (s.outcome === 'violation' || s.violated.length) {
      return h('div', { class: 'sc-summary ' + (s.outcome === 'violation' ? 'violation' : 'inconclusive') },
        s.violated.map(function (v) {
          return h('div', { class: 'row' }, h('span', { class: 'chip ' + (v.isTarget ? 'hit' : 'side'), text: v.id }),
            h('b', { text: v.isTarget ? 'Target violated:' : 'Side effect:' }), v.kinds.map(function (k, i) { return [i ? ', ' : '', h('span', { class: 'kind', text: k })]; }));
        }),
        s.outcomeBasis ? h('div', { class: 'row', text: s.outcomeBasis }) : null);
    }
    if (s.outcome === 'inconclusive') return h('div', { class: 'sc-summary inconclusive' }, h('b', { text: 'Why inconclusive: ' }), s.reasons.length ? s.reasons.join('; ') : (s.outcomeBasis || 'no reason recorded'), ' · never counted as clean.');
    if (s.outcome === 'clean') return h('div', { class: 'sc-summary', text: s.outcomeBasis || 'No invariant violation in any repetition.' });
    return null;
  }

  function renderScenario(s) {
    var d = h('details', { class: 'scenario', data: { scenario: s.id, outcome: s.outcome, reproduced: s.reproduced || '' } },
      h('summary', null,
        h('div', { class: 'sc-title' }, h('div', { class: 't', text: s.title || s.id }), s.title ? h('div', { class: 'id', text: s.id }) : null),
        h('span', { class: 'chips' }, s.targets.length ? s.targets.map(function (t) { return h('span', { class: 'chip target', text: t }); }) : na('no target')),
        h('span', { class: 'sc-repro', title: 'Repetitions in which the target invariant was violated' }, s.reproduced || na(), s.runDots.length ? dots(s.runDots) : null),
        pill(s.outcome, s.outcome),
        icon('chevron', 'chev')));
    var body = h('div', { class: 'sc-body' }, scenarioSummary(s),
      h('div', { class: 'sc-facts' },
        h('span', null, 'Mode ', h('b', null, val(s.mode))),
        s.concurrency && s.concurrency !== 'not_applicable' ? h('span', null, 'Concurrency ', h('b', { text: s.concurrency + (s.verifiedConcurrent !== null ? ' (' + s.verifiedConcurrent + '/' + s.runTotal + ' overlapped)' : '') })) : null,
        s.ledgerIndependent !== null ? h('span', null, 'Independent ledger ', h('b', { text: s.ledgerIndependent ? 'yes' : 'no' })) : null,
        s.runsKnown ? h('span', null, 'Repetitions ', h('b', { text: s.runTotal })) : h('span', null, 'Repetitions ', na())));

    if (!s.hasEvidence && !s.hasRecords) append(body, h('div', { class: 'sc-summary' }, na('Evidence and run records unavailable in this report')));
    append(body, drawer('Evidence', null, [
      s.steps.length ? [h('h4', { text: 'Event sequence · first repetition' }), h('ol', { class: 'steps' }, s.steps.map(function (x) { return h('li', { text: x }); }))] : null,
      s.preconditionFailures.length ? [h('h4', { text: 'Precondition failures' }), h('ul', null, s.preconditionFailures.map(function (x) { return h('li', { text: x }); }))] : null,
      s.verdicts.length ? [h('h4', { text: 'Invariant verdicts' }), verdictTable(s)] : null,
      rawDetails(s),
      !s.steps.length && !s.verdicts.length ? na('No evidence recorded') : null,
    ], { drawer: 'evidence' }));
    append(body, [assumptionsDrawer(s), reproDrawer(s)]);
    append(d, body);
    return d;
  }

  function renderSkipped(s) {
    return h('details', { class: 'scenario', data: { scenario: s.id, outcome: 'skipped' } },
      h('summary', null, h('div', { class: 'sc-title' }, h('div', { class: 't', text: s.id }), h('div', { class: 'id', text: 'not selected' })),
        h('span', { class: 'chips' }, s.targets.map(function (t) { return h('span', { class: 'chip target', text: t }); })), h('span', { class: 'sc-repro', text: '—' }), pill('skipped', 'skipped'), icon('chevron', 'chev')),
      h('div', { class: 'sc-body' }, h('div', { class: 'sc-summary' }, h('b', { text: 'Not run: ' }), 'required mapping entries were not confirmed.',
        s.unmet.length ? h('div', { class: 'row', style: 'margin-top:6px' }, 'Unmet ', s.unmet.map(function (u) { return h('span', { class: 'chip', text: u }); })) : null)));
  }

  function renderScenarios(m) {
    var head = h('div', { class: 'section-head' }, h('h2', { class: 'eyebrow' }, 'Scenarios', h('span', { class: 'count', text: m.scenarios.length + m.skipped.length })));
    var wrap = h('section', { id: 'scenarios' }, head);
    if (!m.scenarios.length && !m.skipped.length) {
      append(wrap, h('div', { class: 'panel panel-pad' }, na(m.status === 'stopped' ? 'No scenarios ran: the investigation stopped before the attack stage.' : m.status === 'error' ? 'No scenarios were recorded before the error.' : !m.hasFindings ? 'Scenario results unavailable in this report.' : 'No scenario findings in this report.')));
      return wrap;
    }
    var order = { violation: 0, inconclusive: 1, error: 1, unknown: 1, clean: 2 };
    var sorted = m.scenarios.slice().sort(function (a, b) { var x = order[a.outcome], y = order[b.outcome]; return ((x === undefined ? 1 : x) - (y === undefined ? 1 : y)) || (a.order - b.order); });
    var list = h('div', { class: 'scenarios', id: 'cards' }, sorted.map(renderScenario), m.skipped.map(renderSkipped));
    var kinds = [['all', 'All']];
    ['violation', 'inconclusive', 'clean'].forEach(function (k) { var n = m.scenarioCounts[k]; if (n) kinds.push([k, k.charAt(0).toUpperCase() + k.slice(1) + ' ' + n]); });

          var self = this;

          Array.prototype.forEach.call(list.children, function (c) { c.hidden = !(k[0] === 'all' || c.dataset.outcome === k[0]); });
        } } }));

  // ---------- side column ----------
  function renderValidation(m) {
    var v = m.validation, mp = m.mapping;

    if (!v) { append(card, na('Validation summary unavailable in this report')); }
    else {
      card.dataset.verdict = v.verdict || '';

        h('div', { class: 'meter', role: 'img', 'aria-label': ok + ' confirmed, ' + cv + ' cannot verify, ' + bad + ' contradicted' },
          h('span', { class: 'm-ok', style: 'width:' + (ok / total * 100) + '%' }), h('span', { class: 'm-cv', style: 'width:' + (cv / total * 100) + '%' }), h('span', { class: 'm-bad', style: 'width:' + (bad / total * 100) + '%' })),
        h('div', { class: 'legend' }, h('span', { class: 'l-ok' }, h('b', { text: ok }), ' confirmed'), h('span', { class: 'l-cv' }, h('b', { text: cv }), ' cannot verify'), h('span', { class: 'l-bad' }, h('b', { text: bad }), ' contradicted'))]);

        row('Cannot verify', val(v.cannotVerify)),
        row('Contradicted', [val(v.contradicted), v.contradictedList.length ? ' (' + v.contradictedList.join(', ') + ')' : '']),
        row('Required, unconfirmed', v.requiredUnconfirmed.length ? v.requiredUnconfirmed.join(', ') : 'none'),
        row('Negative control', val(v.negativeControl)),
        row('Source files read', v.filesRead.length ? h('span', { class: 'chips' }, v.filesRead.map(function (f) { return h('span', { class: 'chip', text: f }); })) : na())));
    }
    append(card, h('dl', { class: 'rows', style: 'border-top:1px solid var(--border);padding-top:12px;margin-top:14px' },
      row('Discovered mapping', mp ? val(mp.name) : na()),
      row('Mapping entries', mp ? val(mp.entries) : na()),
      row('Provenance', mp ? val(mp.provenance) : na())));
    return card;
  }
  function row(label, value) { return h('div', null, h('dt', { text: label }), h('dd', null, value)); }

  function renderPipeline(m) {
    var card = h('section', { class: 'panel', id: 'pipeline' }, h('div', { class: 'section-head' }, h('h2', { class: 'eyebrow' }, 'Pipeline & provenance')));
    if (!m.stages.length) append(card, na('Pipeline stages unavailable in this report'));
    else append(card, h('ol', { class: 'stages' }, m.stages.map(function (s) {
      return h('li', { class: s.ok ? 'ok' : 'fail', title: s.error || null, data: { stage: s.name } }, icon(s.ok ? 'check' : 'x'), s.name,
        s.count > 1 ? h('span', { class: 'x', text: '×' + s.count }) : null, h('span', { class: 'ms', text: fmtMs(s.ms) }));
    })));
    m.stages.filter(function (s) { return !s.ok; }).forEach(function (s) { append(card, h('div', { class: 'notice bad', style: 'margin-top:10px' }, icon('alertOct'), h('div', null, h('b', { text: s.name + ' failed: ' }), s.error || 'no detail recorded'))); });
    append(card, h('dl', { class: 'rows', style: 'border-top:1px solid var(--border);padding-top:12px;margin-top:12px' },
      row('Code', m.code ? [val(m.code.commit, function (c) { return c.slice(0, 7); }), m.code.dirty ? ' · uncommitted changes' + (m.code.changed ? ' (' + m.code.changed + ')' : '') : ''] : na()),
      row('Schema', val(m.schema)),
      row('Started', val(m.startedAt, fmtDate)),
      row('Duration', val(m.durationMs, fmtMs))));
    return card;
  }

  function renderRegressions(m) {
    var card = h('section', { class: 'panel', id: 'regressions' }, h('div', { class: 'section-head' }, h('h2', { class: 'eyebrow' }, 'Regression artifacts')));
    if (!m.regressions.length) append(card, h('div', { class: 'none-note' }, m.scenarioCounts.violation ? na('No regression artifacts listed') : 'None. Generated only for reproducible violations.'));
    else append(card, h('dl', { class: 'rows' }, m.regressions.map(function (a) {
      return row(a.scenario || 'unnamed', a.path ? h('span', { class: 'mono', text: a.path }) : 'generated' + (a.bytes !== null ? ' · ' + a.bytes + ' bytes' : '') + ' · not written to disk');
    })));

  }

  function renderLimitations(m) {
    return h('section', { class: 'limitations', id: 'limitations' }, m.hasLimitations && m.limitations.length
      ? drawer('Limitations & scope', plural(m.limitations.length, 'item'), h('ul', { class: 'limitations-list' }, m.limitations.map(function (l) { return h('li', { text: l }); })), { drawer: 'limitations' })
      : h('div', { class: 'panel panel-pad' }, na('Limitations unavailable in this report; the local-testing disclaimer still applies.')));
  }

  // ------------------------------------------------------------------ states and loading
  var root = document.getElementById('app');
  var input = document.getElementById('file-input');
  var fileNameEl = document.getElementById('file-name');
  var pick = function () { input.click(); };

  function show(nodes) { root.replaceChildren(); append(root, nodes); window.scrollTo(0, 0); }

  function emptyState() {
    fileNameEl.textContent = '';
    document.title = 'PayProbe · Payment Security Intelligence';
    show(h('div', { class: 'state', data: { state: 'empty' } },
      h('div', { class: 'state-card drop' },
        h('div', { class: 'state-icon' }, icon('shieldSearch')),
        h('h1', { text: 'Ready to investigate' }),
        h('p', { text: 'Load an investigation report to see findings, evidence and validation.' }),
        h('div', { class: 'actions' }, h('button', { type: 'button', class: 'btn primary lg', on: { click: pick } }, icon('upload'), 'Load Investigation')),
        h('div', { class: 'hint', text: 'or drop a report file here · Local testing · Mock gateway' }))));
  }

  function loadingState(name) {
    show(h('div', { class: 'state', data: { state: 'loading' } }, h('div', { class: 'state-card' },
      h('div', { class: 'spinner', role: 'progressbar', 'aria-label': 'Loading' }), h('h1', { text: 'Analysing report…' }), h('p', { class: 'mono', text: name }))));
  }

  function invalidState(name, message) {
    fileNameEl.textContent = name || '';
    show(h('div', { class: 'state invalid', data: { state: 'invalid' } }, h('div', { class: 'state-card' },
      h('div', { class: 'state-icon' }, icon('alertOct')),
      h('h1', { text: 'This file can’t be shown' }),
      h('p', { class: 'reason', text: message }),

  }

  function renderReport(m, name) {
    fileNameEl.textContent = name || '';

      safe(function () { return renderHero(m); }, 'Summary'),
      safe(function () { return renderKpis(m); }, 'Outcome summary'),
      safe(function () { return renderPrimary(m); }, 'Primary finding'),
      safe(function () { return renderAi(m); }, 'AI investigator'),
      h('div', { class: 'layout' },
        safe(function () { return renderScenarios(m); }, 'Scenarios'),
        h('aside', { class: 'side' },
          safe(function () { return renderValidation(m); }, 'Validation'),
          safe(function () { return renderPipeline(m); }, 'Pipeline'),
          safe(function () { return renderRegressions(m); }, 'Regression artifacts'))),
      safe(function () { return renderLimitations(m); }, 'Limitations'),
    ]);
  }

  function loadFile(file) {
    if (!file) return;
    var name = file.name;
    loadingState(name);
    var reader = new FileReader();
    reader.onerror = function () { invalidState(name, 'The file could not be read' + (reader.error ? ' (' + reader.error.message + ')' : '') + '.'); };
    reader.onload = function () {
      // Let the loading state paint before parsing a large report.
      requestAnimationFrame(function () { setTimeout(function () {
        try { renderReport(parseReport(reader.result, name), name); }
        catch (e) { invalidState(name, e instanceof ViewerError ? e.message : 'Unexpected problem while reading the report: ' + (e && e.message ? e.message : e)); }
      }, 0); });
    };
    reader.readAsText(file);
  }

  // Theme: dark by default; the choice is a per-viewer convenience and may be unavailable (private mode).
  var THEME_KEY = 'payprobe-viewer-theme';
  try { var saved = localStorage.getItem(THEME_KEY); if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved; } catch (e) { /* storage unavailable */ }
  document.getElementById('theme-btn').addEventListener('click', function () {
    var next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* storage unavailable */ }
  });

  document.getElementById('load-btn').addEventListener('click', pick);
  input.addEventListener('change', function () { var f = input.files && input.files[0]; loadFile(f); input.value = ''; });
  var depth = 0;
  document.addEventListener('dragenter', function (e) { e.preventDefault(); depth++; var d = root.querySelector('.drop'); if (d) d.classList.add('dragging'); });
  document.addEventListener('dragleave', function () { depth = Math.max(0, depth - 1); if (!depth) { var d = root.querySelector('.drop'); if (d) d.classList.remove('dragging'); } });
  document.addEventListener('dragover', function (e) { e.preventDefault(); });
  document.addEventListener('drop', function (e) { e.preventDefault(); depth = 0; var d = root.querySelector('.drop'); if (d) d.classList.remove('dragging'); var f = e.dataTransfer && e.dataTransfer.files[0]; loadFile(f); });

  emptyState();
})();
</script>
